aid: transwarp
name: Transwarp
description: Transwarp Technology (星环科技) is a Shanghai-based enterprise big data
  and AI infrastructure software company backed by Qiming Venture Partners. Its
  self-hosted platform spans Transwarp Data Hub (TDH, including a free Community
  Edition) with the Inceptor SQL analytics engine, Slipstream real-time stream
  computing, Hyperbase wide-table store, StellarDB distributed graph database,
  TimeLyre time-series and Scope search engines, the ArgoDB analytical database,
  the Sophon AI platform (Base, MLDev, MLOps, LLMOps), the TDC data cloud, and
  the Hippo distributed vector database. Hippo exposes a documented RESTful API
  and Python API, with an official hippo-api client library published on PyPI.
