apis:
- aid: transwarp:hippo-restful-api
  name: Transwarp Hippo RESTful API
  description: REST interface of the Transwarp Hippo distributed vector database.
    The published reference covers database and table operations, data writes,
    import/export (standalone mode), index operations, vector retrieval and query
    operations, cluster information, user ACL, tasks, recycle bin, cross-cluster
    synchronization, backup and restore, binary/sparse/high-dimensional vector
    types, full-text and hybrid search, table templates, lifecycle management,
    array operations, storage/memory quotas, and data encryption at rest. Hippo
    is self-hosted software, so the API is served from the customer's own
    deployment rather than a public cloud endpoint.
  humanURL: https://www.transwarp.cn/doc/hippo/2.0-CN/restful-api
